<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mailing Service{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">Главная</a>
        {% if user.is_authenticated %}
            <a href="{% url 'mailing:message_list' %}">Сообщения</a>
            <a href="{% url 'clients:client_list' %}">Клиенты</a>
            <a href="{% url 'users:logout' %}">Выход</a>
        {% else %}
            <a href="{% url 'users:login' %}">Вход</a>
            <a href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
    {% block content %}{% endblock %}
</body>
</html>
