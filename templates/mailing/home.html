{% extends 'base.html' %}

{% block content %}
<h1>Статистика рассылок</h1>
<div class="stats">
    <div class="stat-item">
        <h3>Всего рассылок</h3>
        <p>{{ total_mailings }}</p>
    </div>
    <div class="stat-item">
        <h3>Активных рассылок</h3>
        <p>{{ active_mailings }}</p>
    </div>
    <div class="stat-item">
        <h3>Уникальных клиентов</h3>
        <p>{{ unique_clients }}</p>
    </div>
</div>
{% endblock %}
