{% extends 'base.html' %}

{% block content %}
<h1>Детали рассылки</h1>
<p>Статус: {{ object.status }}</p>
<p>Сообщение: {{ object.message.subject }}</p>
<p>Клиентов: {{ object.clients.count }}</p>

<form method="post" action="{% url 'mailing:send_mailing' object.pk %}">
    {% csrf_token %}
    <button type="submit">Отправить сейчас</button>
</form>
{% endblock %}
